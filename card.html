<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة دعوة - عسير سايبر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2886be;--teal:#1fb6c9;--navy:#12365a;--grey:#5b6b7c;--line:#d9e6ef;--page:#eef3f7}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:'Tajawal',sans-serif;color:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 32px;gap:16px}
#card{width:100%;max-width:380px;background:#fff;border-radius:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 26px 150px;box-shadow:0 6px 24px rgba(18,54,90,.12)}
#card::before{content:"";align-self:stretch;height:8px;margin:0 -26px;background:linear-gradient(90deg,var(--blue),var(--teal))}
.logo{width:210px;max-width:70%;margin-top:26px}
.rule{width:64px;height:3px;border-radius:2px;background:var(--teal);margin:24px 0 20px}
.kicker{font-size:16px;font-weight:500;color:var(--grey)}
.name{font-size:42px;font-weight:800;line-height:1.3;margin:8px 0 12px;color:var(--navy);word-break:break-word}
.invite{font-size:16px;line-height:1.9;color:var(--grey);max-width:290px}
.info{width:100%;margin-top:24px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
.row span:first-child{color:var(--grey)}
.row span:last-child{font-weight:700;text-align:left}
svg.m{position:absolute;bottom:0;left:0;width:100%;height:120px}
.btns{width:100%;max-width:380px;display:grid;gap:10px}
button,a.btn{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:14px;text-align:center;text-decoration:none;cursor:pointer}
.go{background:var(--blue);color:#fff}
.save{background:#fff;color:var(--blue);border:2px solid var(--blue)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<div id="card">
  <img class="logo" src="logo.png" alt="شعار عسير سايبر">
  <div class="rule"></div>
  <div class="kicker">دعوة حضور</div>
  <div class="name" id="name">ضيفنا الكريم</div>
  <div class="invite">يسعدنا دعوتكم لحضور الحفل الختامي لمبادرة عسير سايبر، ويشرفنا حضوركم</div>
  <div class="info">
    <div class="row"><span>التاريخ</span><span id="d"></span></div>
    <div class="row"><span>الوقت</span><span id="t"></span></div>
    <div class="row"><span>المكان</span><span id="p"></span></div>
  </div>
  <svg class="m" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120V70L60 28l45 40 55-48 60 60 45-34 55 44 50-40 30 28v42z" fill="#2886be" opacity=".16"/>
    <path d="M0 120V92l70-38 50 40 60-46 70 54 60-36 90 40v30z" fill="#1fb6c9" opacity=".28"/>
  </svg>
</div>
<div class="btns">
  <a class="btn go" id="confirm" href="#">تأكيد الحضور</a>
  <button class="save" id="save">حفظ كصورة</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var CONFIG = {
  date: '1-11-2026',
  time: ' 10:00 صباحاً',
  place: 'الإدارة العامة للتدريب التقني والمهني بمنطقة عسير',
  formUrl: 'https://forms.gle/ugLLzvQsMHxVR7U98'
};

var n = (new URLSearchParams(location.search).get('n') || 'ضيفنا الكريم').replace(/_/g, ' ');
document.getElementById('name').textContent = n;
document.getElementById('d').textContent = CONFIG.date;
document.getElementById('t').textContent = CONFIG.time;
document.getElementById('p').textContent = CONFIG.place;
document.getElementById('confirm').href = CONFIG.formUrl;

document.getElementById('save').onclick = function(){
  var b = this; b.textContent = 'جارٍ التجهيز...';
  html2canvas(document.getElementById('card'), {scale:3, useCORS:true, backgroundColor:null}).then(function(c){
    c.toBlob(function(blob){
      var f = new File([blob], 'بطاقة-دعوة.png', {type:'image/png'});
      if (navigator.canShare && navigator.canShare({files:[f]})) {
        navigator.share({files:[f]}).catch(function(){});
      } else {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'بطاقة-دعوة.png'; a.click();
      }
      b.textContent = 'حفظ كصورة';
    });
  }).catch(function(){ b.textContent = 'تعذر الحفظ، جرّب لقطة شاشة'; });
};
</script>
</body>
</html>
